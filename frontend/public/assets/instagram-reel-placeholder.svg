<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f16" />
      <stop offset="50%" stop-color="#112d22" />
      <stop offset="100%" stop-color="#06150f" />
    </linearGradient>

    <radialGradient id="instaGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#833AB4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FD1D1D" />
      <stop offset="50%" stop-color="#E1306C" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#instaGlow)" />

  <g transform="translate(600, 310)" text-anchor="middle" filter="url(#shadow)">
    <circle r="72" fill="url(#instaGrad)" opacity="0.9" />
    <circle r="68" fill="#112d22" />
    <polygon points="-8,-20 24,0 -8,20" fill="#FFFFFF" />

    <g transform="translate(38, -38)">
      <rect x="-16" y="-16" width="32" height="32" rx="9" fill="url(#instaGrad)" />
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="5" cy="-5" r="1.2" fill="#FFFFFF" />
    </g>
  </g>

  <g text-anchor="middle">
    <text x="600" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Instagram Reel
    </text>
    <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#A3B8AF" letter-spacing="1.5">
