    </text>

    <rect x="490" y="525" width="220" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="600" y="547" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
      ▶ Click to Play Reel
    </text>
  </g>

  <g transform="translate(48, 48)">
    <rect width="140" height="32" rx="16" fill="rgba(15, 107, 71, 0.4)" stroke="rgba(15, 107, 71, 0.6)" stroke-width="1" />
    <text x="70" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">
      YUM NEST
    </text>
  </g>
