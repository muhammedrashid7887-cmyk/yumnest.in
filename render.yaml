# Render Blueprint Specification for Yumnest.in
# https://render.com/docs/blueprint-spec

services:
  # ─── 1. Yumnest Express Backend API ──────────────────────────────────────────
  - type: web
    name: yumnest-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_COOKIE_NAME
        value: yumnest_admin_session
      - key: SESSION_TTL_DAYS
        value: 7
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ─── 2. Yumnest Next.js Frontend ───────────────────────────────────────────
  - type: web
    name: yumnest-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
